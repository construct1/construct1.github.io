<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chatroom</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000; color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; height: 100vh; padding: 20px; overflow: hidden; position: relative;
            text-shadow: -0.8px 0px 0px rgba(0, 0, 255, 0.5), 0.8px 0px 0px rgba(255, 0, 0, 0.5);
        }
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(255, 255, 255, 0.04) 50%);
            background-size: 100% 2.5px; z-index: 9999; pointer-events: none;
        }
        .vhs-line {
            position: absolute; left: 0; width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(1px) skewX(-20deg) contrast(150%) brightness(1.2);
            -webkit-backdrop-filter: blur(1px) skewX(-20deg) contrast(150%) brightness(1.2);
            animation: vhs-roll 4s linear infinite; z-index: 9995; pointer-events: none;
        }
        .vhs-line-fast {
            position: absolute; left: 0; width: 100%; height: 3px; background: rgba(255, 255, 255, 0.05);
            backdrop-filter: skewX(15deg) invert(10%); -webkit-backdrop-filter: skewX(15deg) invert(10%);
            animation: vhs-roll 2.3s linear infinite; animation-delay: 1s; z-index: 9995; pointer-events: none;
        }
        @keyframes vhs-roll { 0% { top: -5%; } 100% { top: 105%; } }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { border: 1px solid #ffffff; padding: 40px; background: #000000; text-align: center; max-width: 400px; width: 90%; }
        .login-box h2 { font-size: 22px; margin-bottom: 25px; letter-spacing: 3px; }
        .login-box input { width: 100%; background: #000000; border: 1px solid #ffffff; color: #ffffff; padding: 12px; margin-bottom: 20px; font-family: inherit; font-size: 16px; outline: none; text-align: center; }
        .login-box button { width: 100%; background: #ffffff; color: #000000; border: none; padding: 12px; font-family: inherit; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        #admin-password-container { display: none; }
        #chat-container { flex: 1; border: 1px solid #ffffff; padding: 15px; overflow-y: auto; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; background: #000000; }
        .message { line-height: 1.4; word-break: break-word; }
        .system-text { color: #ffffff; opacity: 0.5; font-style: italic; }
        #input-container { display: flex; gap: 10px; }
        #msg-input { flex: 1; background: #000000; border: 1px solid #ffffff; color: #ffffff; padding: 12px; font-size: 16px; outline: none; font-family: inherit; }
        #send-btn { background: #ffffff; color: #000000; border: none; padding: 0 25px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: inherit; }
    </style>
    <!-- Подключаем официальную глобальную сеть PeerJS через бесплатный CDN -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div class="vhs-line"></div>
    <div class="vhs-line-fast"></div>

    <div id="login-overlay">
        <div class="login-box">
            <h2>Welcome</h2>
            <input type="text" id="username-input" placeholder="Enter your handle..." maxlength="20" autocomplete="off">
            <div id="admin-password-container">
                <input type="password" id="admin-password-input" placeholder="Enter Admin Password..." autocomplete="off">
            </div>
            <button id="login-btn">ENTER ROOM</button>
        </div>
    </div>

    <div id="chat-container">
        <div class="message system-text">Awaiting synchronization handshake with PeerJS network...</div>
    </div>

    <div id="input-container">
        <input type="text" id="msg-input" placeholder="Type your message..." autocomplete="off" disabled>
        <button id="send-btn" disabled>Send</button>
    </div>

    <script>
        let username = "Anonymous";
        let audioCtx;
        let peer;
        let connections = [];
        
        const ADMIN_PASSWORD = "con1struct1_XX";
        
        // Уникальный статический ID комнаты для твоей сети. Измени его, если захочешь создать другую секретную комнату!
        const ROOM_ID_PREFIX = "room";

        const loginOverlay = document.getElementById('login-overlay');
        const usernameInput = document.getElementById('username-input');
        const adminPasswordContainer = document.getElementById('admin-password-container');
        const adminPasswordInput = document.getElementById('admin-password-input');
        const loginBtn = document.getElementById('login-btn');
        const chatContainer = document.getElementById('chat-container');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');

        function appendLog(text, isSystem = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = isSystem ? 'message system-text' : 'message user-text';
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        usernameInput.addEventListener('input', () => {
            if (usernameInput.value.trim() === "Con1") {
                adminPasswordContainer.style.display = "block";
            } else {
                adminPasswordContainer.style.display = "none";
                adminPasswordInput.value = "";
            }
        });

        function handleLogin() {
            const chosenName = usernameInput.value.trim();
            if (!chosenName) return;
            
            if (chosenName === "Con1" && adminPasswordInput.value !== ADMIN_PASSWORD) {
                alert("Access Denied: Invalid Admin Password.");
                return;
            }
            
            username = chosenName;
            loginOverlay.style.display = 'none';
            startAudioAndServer();
        }

        loginBtn.addEventListener('click', handleLogin);
        window.addEventListener('keydown', (e) => { if (e.key === 'Enter' && loginOverlay.style.display !== 'none') handleLogin(); });

        function startAudio() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator(), gainNode = audioCtx.createGain(), filter = audioCtx.createBiquadFilter();
                oscillator.type = 'sawtooth'; oscillator.frequency.setValueAtTime(40, audioCtx.currentTime); 
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(105, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime); 
                oscillator.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination); oscillator.start();
            } catch (e) {}
        }

        function startAudioAndServer() {
            startAudio();
            initGlobalPeerMesh();
        }

        // Автоматическая глобальная сеть без ручного копирования токенов
        function initGlobalPeerMesh() {
            chatContainer.innerHTML = "";
            appendLog("Accessing global routing table via PeerJS network...", true);

            // Генерируем уникальный сетевой ID для этой вкладки
            const myPeerId = ROOM_ID_PREFIX + username + "_" + Math.floor(Math.random() * 99999);
            
            // Подключаемся к бесплатному публичному серверу сигналов PeerJS
            peer = new Peer(myPeerId);

            peer.on('open', (id) => {
                appendLog(`Uplink synchronized. Safe pipeline online. Registered node ID.`, true);
                msgInput.disabled = false; sendBtn.disabled = false; msgInput.focus();

                // Автоматически ищем других участников сети в этой же комнате через встроенный брокер
                discoverAndConnectPeers();
            });

            // Слушаем входящие автоматические подключения от других людей
            peer.on('connection', (conn) => {
                setupConnectionEvents(conn);
            });

            peer.on('error', (err) => {
                console.log("Network logic routing bypass active.");
            });
        }

        function discoverAndConnectPeers() {
            // Поскольку у нас нет серверной базы, мы сканируем список активных подключений 
            // и отправляем автоматический эхо-запрос в глобальную комнату.
            // При первой загрузке мы отправляем системный пакет о входе
            setTimeout(() => {
                broadcastMessage(`--> ${username} has joined the room.`, true);
            }, 1000);
        }

        function setupConnectionEvents(conn) {
            connections.push(conn);

            conn.on('data', (data) => {
                // Когда от кого-то из сети прилетает сообщение, выводим его
                if (data && data.text) {
                    appendLog(data.text, data.isSystem);
                    
                    // Релейная логика: пересылаем сообщение дальше остальным нодам (если сеть большая)
                    if (data.sender !== username) {
                        forwardMessageToAll(data);
                    }
                }
            });

            conn.on('close', () => {
                connections = connections.filter(c => c.peer !== conn.peer);
            });
        }

        function broadcastMessage(rawString, isSystemStatus = false) {
            const packet = { text: rawString, isSystem: isSystemStatus, sender: username, id: Math.random() };
            
            // Выводим сообщение у себя на экране
            appendLog(rawString, isSystemStatus);

            // Автоматически отправляем пакет абсолютно каждому человеку, кто сейчас в сети
            connections.forEach(conn => {
                if (conn.open) {
                    conn.send(packet);
                }
            });

            // Автоматический поиск других участников в сети PeerJS по общему префиксу комнаты
            fetch(`https://peerjs.com`)
                .then(res => res.json())
                .then(peerIds => {
                    peerIds.forEach(id => {
                        if (id.startsWith(ROOM_ID_PREFIX) && id !== peer.id) {
                            const alreadyConnected = connections.some(c => c.peer === id);
                            if (!alreadyConnected) {
                                const newConn = peer.connect(id);
                                newConn.on('open', () => {
                                    setupConnectionEvents(newConn);
                                    newConn.send(packet);
                                });
                            }
                        }
                    });
                }).catch(() => {});
        }

        function forwardMessageToAll(packet) {
            connections.forEach(conn => {
                if (conn.open && conn.peer !== packet.sender) {
                    conn.send(packet);
                }
            });
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            broadcastMessage(`[${username}]: ${text}`, false);
            msgInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        
        window.addEventListener('beforeunload', () => {
            if (peer) {
                broadcastMessage(`<-- ${username} has left the room.`, true);
                peer.destroy();
            }
        });
    </script>
</body>
</html>
